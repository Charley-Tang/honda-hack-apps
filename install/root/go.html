<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="shortcut icon" href="/static/favicon.ico">
    <meta name="description" content="快启动科技, 中控大师车机优化系统，适用车型本田十代思域、CRV、皓影、冠道、URV、讴歌CDX">
    <title>中控大师车机优化系统，快启动科技</title>
    <script src="xmlgen.js"></script>
    <script type="text/javascript">
        var url_all = window.location.href;
        var url_s = url_all.split(".")[0];
        var doma = url_s.split("//")[1];
        if (doma == "ussss" || doma == "hondamaster") {
            var agent_code = "official";
        }else{
            var agent_code = "official";
            // var agent_code = doma;
        }
        
        var active_code = '0000000000';
        window.load = function() {
            var a = (new DOMParser).parseFromString("<root/>", "text/xml"),
                c = (new DOMParser).parseFromString('<xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" version="1.0" ><xsl:template match="/*"><data><xsl:value-of select="generate-id()" /></data></xsl:template></xsl:stylesheet>', "text/xml"),
                b = new XSLTProcessor;
            b.importStylesheet(c);
            a = b.transformToDocument(a);
            void 0 === a && window.location.replace("error.html");
            a = a.getElementsByTagName("data")[0].childNodes[0].nodeValue;
            a = a.replace(/[0-9]/g, "");
            c = document.getElementsByTagName("head")[0];
            b = document.createElement("script");
            b.type = "text/javascript";
            b.onload = function() {
                window.start()
            };
            b.src = "script" + a + ".js?key="+active_code;
            c.appendChild(b)
        }
    </script>
    <style>
        *{margin:0;padding:0;}
        .container{
            margin: 0 auto;
            width: 100%;
            height: auto;
            padding: 0px;
            border: 0px;
            position:relative;
        }
        .top{
            margin: 0 auto;
            background-size: 100%;
            text-align: center;
            padding-top: 5px;
        }

        .tip {
            position: relative;
            text-align: center;
            top: 2px;
            font-size: 20px;
            color: black;
        }

        li{
            list-style-type:none;
            margin-top: 3px;
        }
        .tip2{
            font-size: 14px;
            color: green;
        }

        .tip3{
            font-size: 12px;
            color: red;
            font-weight:bold;
        }

        .copyright{
            position: fixed;
            bottom: 10px;
            text-align: center;
            width: 100%;
        }

        .qr{
            position:absolute;top:10px;right:10px;
            text-align: center;
            z-index: 100;
        }
    </style>
</head>
<body onload="load()">
<div class="container">
    <div class="top">
        <img src="/static/images/45.gif">
    </div>
    <div class="tip">
        <ul>
            <li>正在优化中...</li>
            <li>请耐心等待，不要将浏览器切换到后台</li>
            <li>优化完成，会自动弹出提示</li>
            <li>正常1~2分钟就能完成优化（网速慢会久一点）</li>
            <li class="tip2">*如果超过5分钟未完成，请长按HOME键调出任务管理器，强制结束所有程序后重试</li>
        </ul>
    </div>
    <div class="copyright">@深圳市快启动科技有限公司</div>
</div>
</body>
</html>
