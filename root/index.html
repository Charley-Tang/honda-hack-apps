<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本田黑科技 · 一键安装</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #0f1216; color: #e8eef6;
    font: 16px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 18px 16px 28px; }
  h1 { font-size: 20px; margin: 4px 0 6px; font-weight: 600; }
  .sub { color: #8fa1b6; font-size: 13px; margin: 0 0 16px; }
  #go {
    width: 100%; padding: 18px; border: 0; border-radius: 12px;
    font-size: 20px; font-weight: 700; color: #08131f; cursor: pointer;
    background: -webkit-linear-gradient(top, #5ed6ff, #2aa8ff);
    background: linear-gradient(180deg, #5ed6ff, #2aa8ff);
  }
  #go:disabled { background: #26313e; color: #7d8b9c; }
  .pbar {
    position: relative; height: 14px; margin: 18px 0 8px;
    background: #1b2430; border-radius: 8px; overflow: hidden;
  }
  #fill {
    width: 0; height: 100%; border-radius: 8px;
    background: -webkit-linear-gradient(left, #2aa8ff, #54e0a8);
    background: linear-gradient(90deg, #2aa8ff, #54e0a8);
    -webkit-transition: width .25s ease;
    transition: width .25s ease;
  }
  .prow { display: -webkit-box; display: flex; -webkit-box-pack: justify;
          justify-content: space-between; font-size: 14px; color: #9fb0c4; }
  #pct { font-weight: 700; color: #cfe6ff; }
  #log {
    margin-top: 14px; height: 44vh; min-height: 180px; overflow: auto;
    background: #0b0f14; border: 1px solid #1e2937; border-radius: 10px;
    padding: 10px 12px; font: 13px/1.45 Consolas, Menlo, monospace;
    -webkit-overflow-scrolling: touch;
  }
  #log div { padding: 1px 0; word-break: break-all; }
  #log .t { color: #5b6b7d; margin-right: 6px; }
  .ok { color: #54e0a8; }
  .warn { color: #ffcc66; }
  .err { color: #ff6b6b; }
  .step { color: #8fd0ff; }
</style>
<script src="config.js"></script>
</head>
<body>
<div class="wrap">
  <h1>本田黑科技 · 一键 Root 安装</h1>
  <p class="sub">适用于 Android 4.2 车机自带浏览器。点击开始后请保持此页面在前台，不要切换标签或锁屏。</p>

  <button id="go" onclick="begin()">开 始</button>

  <div class="pbar"><div id="fill"></div></div>
  <div class="prow"><span id="step">等待开始</span><span id="pct">0%</span></div>

  <div id="log"></div>
</div>

<script>
/* ======================= 基础状态 ======================= */
var key = '0946993636'
var flags = '2'
var agent = ''

var pct = 0, started = false, finished = false, native = false
var nativeT0 = 0, pollTimer = null, estTimer = null
var lastEventIdx = 0, resetDone = false

function $(id) { return document.getElementById(id) }
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
}
function ts() {
  var d = new Date()
  function p(n) { return (n < 10 ? '0' : '') + n }
  return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds())
}
function log(msg, cls) {
  var box = $('log')
  var row = document.createElement('div')
  if (cls) row.className = cls
  row.innerHTML = '<span class="t">' + ts() + '</span>' + esc(msg)
  box.appendChild(row)
  while (box.childNodes.length > 400) box.removeChild(box.firstChild)
  box.scrollTop = box.scrollHeight
}
function setPct(p, text) {
  if (p > pct) pct = p
  if (pct > 100) pct = 100
  $('fill').style.width = pct + '%'
  $('pct').innerHTML = Math.round(pct) + '%'
  if (text) $('step').innerHTML = esc(text)
}

/* ======================= 捕获漏洞脚本的日志 ======================= */
var MAP = [
  [/pages mapped/i,            12, '内存布局完成'],
  [/\[ Stage 1 \]/i,           20, '漏洞利用 1/4：信息泄露'],
  [/\[ Stage 2 \]/i,           32, '漏洞利用 2/4：内存破坏'],
  [/MemoryObject created/i,    45, '内存读写对象就绪'],
  [/\[ Stage 3 \]/i,           52, '漏洞利用 3/4：代码执行'],
  [/Got RCE/i,                 62, '已取得代码执行（RCE）'],
  [/\[ Stage 4 \]/i,           68, '注入原生模块 module.so'],
  [/Starting module download/i, 70, '下载 module.so'],
  [/Module downloaded/i,        74, 'module.so 下载完成']
]
var fired = {}

function mapInfo(m) {
  for (var i = 0; i < MAP.length; i++) {
    if (MAP[i][0].test(m) && !fired[i]) {
      fired[i] = true
      setPct(MAP[i][1], MAP[i][2])
      log('→ ' + MAP[i][2], 'step')
      if (i === 6) startNative()
    }
  }
}

window.INFO = function (m) { log(m); mapInfo(String(m)) }

window.ERR = function (m) {
  log('错误：' + m, 'err')
  setPct(pct, '执行失败')
  stopTimers()
  $('go').disabled = true
  $('go').innerHTML = '已中断'
  throw Error(m)
}

/* ======================= 原生阶段：真实进度回传 ======================= */
function statusUrl() {
  var u = (typeof C2_URL === 'string' && C2_URL) ? C2_URL : ''
  if (!u) return null
  return u.replace(/\/+$/, '') + '/status.php'
}
function fetchStatus(query, cb) {
  var url = statusUrl()
  if (!url) return
  var req = new XMLHttpRequest()
  req.open('GET', url + query, true)
  req.onreadystatechange = function () {
    if (req.readyState !== 4) return
    if (req.status !== 200) return
    var data = null
    try { data = JSON.parse(req.responseText) } catch (e) { return }
    cb(data)
  }
  try { req.send(null) } catch (e) {}
}

function startNative() {
  if (native) return
  native = true
  nativeT0 = new Date().getTime()
  log('进入原生阶段：下载提权程序 / 安装 su / 下载并安装 APK，进度由车机回报', 'warn')

  // 清空服务器上的进度记录，然后开始轮询
  fetchStatus('?reset=1', function () { resetDone = true })
  pollTimer = setInterval(function () {
    fetchStatus('?since=0', function (data) {
      var evs = data.events || []
      for (var i = lastEventIdx; i < evs.length; i++) {
        var e = evs[i]
        if (!e || typeof e.p !== 'number') continue
        var txt = e.m || ''
        if (/fail|error/i.test(txt)) {
          log('车机：' + txt, 'err')
          stopTimers()
          setPct(e.p, '失败：' + txt)
          $('go').disabled = true
          $('go').innerHTML = '已中断'
          return
        }
        log('车机：' + txt, 'ok')
        if (e.p >= 100) { complete(); return }
        setPct(Math.min(e.p, 99), e.m)
      }
      if (evs.length > lastEventIdx) lastEventIdx = evs.length
    })
  }, 1500)

  estTimer = setInterval(estimate, 1000)
}

/* 没有实时回传时的兜底估算（真实回传会盖过它） */
var EST = [
  [8,   78, '下载提权程序 exploit'],
  [20,  82, '安装 su / busybox'],
  [45,  86, '下载安装包 HKJ770'],
  [90,  90, '安装 本田黑科技 APK'],
  [150, 94, '启动应用']
]
function estimate() {
  var secs = (new Date().getTime() - nativeT0) / 1000
  for (var i = EST.length - 1; i >= 0; i--) {
    if (secs >= EST[i][0]) {
      if (EST[i][1] > pct) setPct(EST[i][1], EST[i][2] + '（估算）')
      return
    }
  }
}

function complete() {
  if (finished) return
  finished = true
  stopTimers()
  setPct(100, '完成，请回到桌面打开「本田黑科技」')
  log('安装完成，请回到桌面打开「本田黑科技」', 'ok')
  $('go').disabled = true
  $('go').innerHTML = '已完成'
}
function stopTimers() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null }
  if (estTimer) { clearInterval(estTimer); estTimer = null }
}

/* ======================= 开始 ======================= */
function begin() {
  if (started) return
  started = true
  $('go').disabled = true
  $('go').innerHTML = '执行中…'
  setPct(3, '加载漏洞脚本')
  log('开始执行，请勿关闭页面')

  if (!window.XSLTProcessor) {
    log('当前浏览器不支持 XSLT，无法利用该漏洞', 'err')
    setPct(0, '浏览器不支持')
    return
  }

  var s = document.createElement('script')
  s.type = 'text/javascript'
  s.src = 'scriptid.js?t=' + new Date().getTime()
  s.onload = function () {
    log('scriptid.js 已加载，开始利用')
    window.start()
  }
  s.onerror = function () {
    log('scriptid.js 加载失败，请确认文件已部署', 'err')
    setPct(0, '加载失败')
  }
  document.getElementsByTagName('head')[0].appendChild(s)
}
</script>
</body>
</html>
